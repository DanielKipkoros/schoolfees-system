{% extends "students_app/base.html" %}

{% block content %}
<div class="container mt-4">
    <h3 class="mb-3">System Activity Logs</h3>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>User</th>
                <th>Action</th>
                <th>Description</th>
                <th>Date & Time</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.user }}</td>
                <td>{{ log.get_action_display }}</td>
                <td>{{ log.description }}</td>
                <td>{{ log.timestamp }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No activity yet</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

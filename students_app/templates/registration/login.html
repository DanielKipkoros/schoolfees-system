<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | ST JOSEPH PREPARATORY SCHOOL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .dashboard-header img { max-width: 250px; margin-bottom: 15px; }

        .login-card {
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-card h3 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
            color: #4e73df;
        }

        .btn-login {
            background-color: #4e73df;
            border: none;
        }

        .btn-login:hover {
            background-color: #2e59d9;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3>ST JOSEPH PREPARATORY SCHOOL LOGIN</h3>

    {% if form.errors %}
        <div class="alert alert-danger">
            Invalid username or password
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username</label>
            {{ form.username }}
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="btn btn-login w-100 text-white">
            Login
        </button>
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            color: #d9534f;
        }
        button {
            padding: 10px 15px;
            background-color: #d9534f;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }
        a {
            padding: 10px 15px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delete Student</h1>
        <p>Are you sure you want to delete <strong>{{ student.admission_number  }}</strong> (Name: {{ student.name }})?</p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete</button>
            <a href="{% url 'add_student' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
